version: '3.8'

services:
  redis:
    image: redis:alpine
    restart: unless-stopped

  signaling:
    build: ./server
    restart: unless-stopped
    ports:
      - "${SIGNALING_PORT:-3000}:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - ORACLE_WALLET_DIR=/opt/oracle/wallet
      - TURN_URL=${TURN_URL}
      - TURN_USER=${TURN_USER}
      - TURN_PASS=${TURN_PASS}
    depends_on:
      - redis

  coturn:
    image: instrumentisto/coturn:4
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-65535:49152-65535/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/coturn/certs:ro

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - signaling
