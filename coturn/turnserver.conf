# Basic coturn config for GlobeChat (edit before production)
listening-port=3478
# tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_RANDOM_SECRET
relay-ip=0.0.0.0
external-ip=YOUR_VM_PUBLIC_IP/PRIVATE_IP
realm=globechat
no-multicast-peers
min-port=49152
max-port=65535
# certificate paths (used if you enable TLS/TLS listening)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# logging
simple-log
log-file=/var/log/turnserver.log
