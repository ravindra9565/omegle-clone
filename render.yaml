services:
  - type: web
    name: globchat
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

